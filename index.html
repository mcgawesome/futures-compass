<meta charset="utf-8">
<title>Futures Compass</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,340..480;0,9..144,600..700;1,9..144,400..560&family=Archivo:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
  :root{
    --ground:#E2E7DF;
    --surface:#F4F6EF;
    --surface-2:#EAEEE3;
    --field:#FFFFFF;
    --border:#A9B49C;
    --ink:#182027;
    --ink-soft:#3E4A45;
    --muted:#5E6E67;
    --brass:#A9702A;
    --brass-soft:#E8D3AF;
    --teal:#285C63;
    --teal-soft:#C9DEDC;
    --moss:#3C6B49;
    --moss-soft:#CFE0CE;
    --vermilion:#9C4030;
    --vermilion-soft:#ECD3CB;
    --font-display:'Fraunces', Georgia, 'Times New Roman', serif;
    --font-body:'Archivo', -apple-system, 'Segoe UI', sans-serif;
    --font-mono:'IBM Plex Mono', 'SF Mono', Menlo, monospace;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --ground:#10161A; --surface:#171E22; --surface-2:#1D262A; --field:#0C1113; --border:#4A5A5F;
      --ink:#E7ECE8; --ink-soft:#C7D0CB; --muted:#93A29A;
      --brass:#D3924C; --brass-soft:#4A3A24;
      --teal:#5FA6AC; --teal-soft:#1E3A3C;
      --moss:#7CB489; --moss-soft:#223A29;
      --vermilion:#D97C68; --vermilion-soft:#3D231E;
    }
  }
  :root[data-theme="dark"]{
    --ground:#10161A; --surface:#171E22; --surface-2:#1D262A; --field:#0C1113; --border:#4A5A5F;
    --ink:#E7ECE8; --ink-soft:#C7D0CB; --muted:#93A29A;
    --brass:#D3924C; --brass-soft:#4A3A24;
    --teal:#5FA6AC; --teal-soft:#1E3A3C;
    --moss:#7CB489; --moss-soft:#223A29;
    --vermilion:#D97C68; --vermilion-soft:#3D231E;
  }
  *{box-sizing:border-box;}
  body{background:var(--ground);}
  .app{max-width:1180px; margin:0 auto; padding:30px 24px 56px; font-family:var(--font-body); color:var(--ink); background:var(--ground);}
  h1,h2,h3,h4,h5{text-wrap:balance;}
  p{max-width:70ch;}
  ::selection{background:var(--brass-soft);}

  .topbar{display:flex; justify-content:space-between; gap:20px; align-items:flex-start; padding-bottom:20px; border-bottom:1px solid var(--border);}
  .brand{display:flex; gap:14px; align-items:flex-start;}
  .brand-mark{font-size:1.7rem; color:var(--brass); line-height:1.1; font-family:var(--font-display);}
  h1{font-family:var(--font-display); font-style:italic; font-weight:600; font-size:1.85rem; margin:0;}
  .tagline{margin:5px 0 0; color:var(--muted); font-size:.92rem; max-width:48ch; line-height:1.45;}
  .ai-note{font-size:.76rem; line-height:1.4; color:var(--vermilion); background:var(--vermilion-soft); padding:8px 12px; border-radius:7px; max-width:230px;}

  .course{display:flex; align-items:flex-start; margin:26px 0 4px;}
  .stop{display:flex; flex-direction:column; align-items:center; gap:6px; background:none; border:none; cursor:pointer; font-family:var(--font-body); color:var(--muted); padding:2px 12px;}
  .stop:disabled{cursor:not-allowed; opacity:.45;}
  .stop-num{font-family:var(--font-mono); font-size:.66rem; letter-spacing:.06em;}
  .stop-dot{width:12px; height:12px; border-radius:50%; border:2px solid var(--border); background:var(--surface);}
  .stop.is-reached .stop-dot{border-color:var(--brass); background:var(--brass-soft);}
  .stop.is-current .stop-dot{border-color:var(--brass); background:var(--brass); box-shadow:0 0 0 4px var(--brass-soft);}
  .stop.is-current{color:var(--ink); font-weight:600;}
  .stop-label{font-size:.82rem;}
  .stop-time{font-family:var(--font-mono); font-size:.62rem; color:var(--muted); opacity:.85;}
  .course-line{flex:1; height:1px; background:var(--border); margin-top:15px;}

  .wire{margin:16px 0 0; padding:12px 14px; background:var(--surface-2); border:1px solid var(--border); border-radius:8px; display:flex; gap:12px; align-items:flex-start;}
  .wire[hidden]{display:none !important;}
  .wire-body{flex:1; min-width:0;}
  .wire-label{font-family:var(--font-mono); font-size:.68rem; text-transform:uppercase; letter-spacing:.08em; color:var(--brass); display:block; margin-bottom:4px;}
  .wire pre{margin:0; font-family:var(--font-mono); font-size:.76rem; color:var(--muted); white-space:pre-wrap; max-height:4.6em; overflow:hidden;}

  .deck{display:grid; grid-template-columns:1fr 320px; gap:26px; align-items:start; margin-top:22px;}
  @media (max-width:880px){.deck{grid-template-columns:1fr;}}
  .canvas{background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:28px; min-height:320px;}
  .rail{position:sticky; top:20px; display:flex; flex-direction:column; gap:16px;}
  .rail-block{background:var(--surface-2); border:1px solid var(--border); border-radius:10px; padding:16px;}
  .rail-block h3{font-family:var(--font-mono); font-size:.7rem; text-transform:uppercase; letter-spacing:.08em; color:var(--muted); margin:0 0 10px;}
  .log-item{font-size:.84rem; margin:0 0 8px; padding-bottom:8px; border-bottom:1px dashed var(--border); line-height:1.4;}
  .log-item:last-child{border:none; margin:0; padding:0;}
  .log-item b{display:block; font-size:.68rem; text-transform:uppercase; letter-spacing:.05em; color:var(--teal); margin-bottom:2px; font-weight:600;}
  .log-empty{font-size:.82rem; color:var(--muted); font-style:italic;}

  textarea, input[type=text]{width:100%; font-family:var(--font-body); font-size:.92rem; padding:10px 12px; border:1.5px solid var(--border); border-radius:7px; background:var(--field); color:var(--ink); box-shadow:inset 0 1px 3px rgba(0,0,0,.06);}
  textarea{resize:vertical; line-height:1.45;}
  textarea:hover, input[type=text]:hover{border-color:var(--brass);}
  textarea:focus, input:focus{outline:2px solid var(--teal); outline-offset:1px; border-color:var(--teal);}
  .field{margin-bottom:16px;}
  .field label{display:block; font-family:var(--font-mono); font-size:.68rem; text-transform:uppercase; letter-spacing:.07em; color:var(--muted); margin-bottom:6px;}

  button.btn{font-family:var(--font-body); font-weight:600; font-size:.87rem; padding:10px 16px; border-radius:7px; border:1px solid var(--brass); background:var(--brass); color:#fff; cursor:pointer; box-shadow:0 1px 2px rgba(0,0,0,.18);}
  button.btn:hover:not(:disabled){box-shadow:0 2px 5px rgba(0,0,0,.22); transform:translateY(-1px);}
  button.btn:hover:not(:disabled){filter:brightness(1.07);}
  button.btn:disabled{opacity:.4; cursor:not-allowed;}
  button.btn.secondary{background:transparent; color:var(--brass);}
  button.btn.ghost{background:transparent; color:var(--muted); border-color:var(--border);}
  button.btn.small{padding:6px 11px; font-size:.78rem;}
  button:focus-visible, .stop:focus-visible, .axis-star:focus-visible{outline:2px solid var(--teal); outline-offset:2px;}
  button.linklike{background:none; border:none; color:var(--teal); text-decoration:underline; cursor:pointer; font-size:.85rem; font-family:var(--font-body); padding:0;}

  .btn-row{display:flex; gap:10px; flex-wrap:wrap; margin-top:6px;}
  .example-badge{display:inline-block; font-family:var(--font-mono); font-size:.66rem; text-transform:uppercase; letter-spacing:.06em; color:var(--teal); background:var(--teal-soft); padding:3px 9px; border-radius:5px; margin-bottom:12px;}
  .hint{font-size:.79rem; color:var(--vermilion); margin-top:6px;}
  .error-note{font-size:.82rem; color:var(--vermilion); background:var(--vermilion-soft); padding:9px 12px; border-radius:7px; margin:14px 0;}
  .stale-banner{background:var(--brass-soft); border:1px solid var(--brass); color:var(--brass); padding:10px 14px; border-radius:8px; font-size:.84rem; margin-bottom:18px;}

  .driver-list{display:flex; flex-direction:column; gap:10px; margin-bottom:16px;}
  .driver-card{background:var(--surface-2); border:1px solid var(--border); border-radius:10px; padding:14px 16px;}
  .driver-top{display:flex; justify-content:space-between; gap:12px; align-items:flex-start;}
  .driver-name{font-weight:600; font-size:.95rem; margin:0 0 3px;}
  .driver-desc{font-size:.83rem; color:var(--ink-soft); margin:0;}
  .driver-tools{display:flex; gap:8px; align-items:center; flex-shrink:0;}
  .axis-star{border:1px solid var(--border); background:var(--surface); border-radius:6px; padding:6px 10px; cursor:pointer; font-size:.76rem; color:var(--muted); font-family:var(--font-body); white-space:nowrap;}
  .axis-star.is-on{background:var(--brass-soft); border-color:var(--brass); color:var(--brass); font-weight:600;}
  .remove-x{border:none; background:none; color:var(--muted); cursor:pointer; font-size:1rem; line-height:1; padding:4px;}
  .slider-group{display:flex; gap:20px; margin-top:12px; flex-wrap:wrap;}
  .slider-item{display:flex; flex-direction:column; gap:5px; min-width:150px; flex:1;}
  .slider-item span.lbl{font-family:var(--font-mono); font-size:.66rem; text-transform:uppercase; letter-spacing:.05em; color:var(--muted); display:flex; justify-content:space-between;}
  .slider-item.impact .readout{color:var(--brass); font-weight:600;}
  .slider-item.uncertainty .readout{color:var(--teal); font-weight:600;}
  input[type=range]{width:100%; accent-color:var(--brass);}
  .slider-item.uncertainty input[type=range]{accent-color:var(--teal);}
  .add-driver-form{display:grid; grid-template-columns:1fr 1.4fr auto; gap:8px; align-items:end; margin-bottom:18px;}
  @media (max-width:640px){.add-driver-form{grid-template-columns:1fr;}}

  .matrix{display:grid; grid-template-columns:34px 130px 1fr 1fr; grid-template-rows:auto auto 1fr 1fr; gap:10px; margin-bottom:18px;}
  .axis-name-top{grid-column:3/5; text-align:center; font-family:var(--font-mono); font-size:.68rem; color:var(--brass); text-transform:uppercase; letter-spacing:.08em;}
  .axis-label-top{font-family:var(--font-mono); font-size:.72rem; text-transform:uppercase; letter-spacing:.05em; color:var(--muted); display:flex; align-items:center; justify-content:center; text-align:center; padding:4px;}
  .axis-name-side{grid-row:3/5; writing-mode:vertical-rl; transform:rotate(180deg); font-family:var(--font-mono); font-size:.68rem; color:var(--teal); text-transform:uppercase; letter-spacing:.08em; display:flex; align-items:center; justify-content:center;}
  .axis-label-side{writing-mode:vertical-rl; transform:rotate(180deg); font-family:var(--font-mono); font-size:.72rem; text-transform:uppercase; letter-spacing:.05em; color:var(--muted); display:flex; align-items:center; justify-content:center; text-align:center;}
  .quad-card{background:var(--surface-2); border:1px solid var(--border); border-radius:10px; padding:16px;}
  .quad-card h4{font-family:var(--font-display); font-style:italic; font-weight:600; font-size:1.14rem; margin:0 0 8px;}
  .quad-card p{font-size:.88rem; line-height:1.55; color:var(--ink-soft); margin:0 0 10px;}
  .signals{display:flex; flex-wrap:wrap; gap:6px; margin-bottom:12px;}
  .signal-tag{font-family:var(--font-mono); font-size:.66rem; background:var(--surface); border:1px solid var(--border); border-radius:999px; padding:3px 9px; color:var(--muted);}
  .card-actions{display:flex; gap:8px; flex-wrap:wrap;}
  .critique{margin-top:12px; padding:10px 12px; background:var(--vermilion-soft); border-left:3px solid var(--vermilion); border-radius:0 6px 6px 0; font-size:.83rem; color:var(--ink);}
  .critique b{display:block; font-family:var(--font-mono); font-size:.66rem; text-transform:uppercase; color:var(--vermilion); margin-bottom:4px; letter-spacing:.05em;}
  .pending-note{font-family:var(--font-mono); font-size:.76rem; color:var(--muted); font-style:italic;}

  .concept-group{margin-bottom:26px;}
  .concept-group h4{font-family:var(--font-display); font-style:italic; font-size:1.05rem; margin:0 0 12px; color:var(--ink);}
  .concept-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(230px,1fr)); gap:12px;}
  .concept-card{background:var(--surface-2); border:1px solid var(--border); border-radius:10px; padding:14px;}
  .concept-card.is-shortlisted{border-color:var(--brass); box-shadow:0 0 0 1px var(--brass);}
  .concept-card h5{margin:0 0 6px; font-size:.94rem;}
  .concept-card p{font-size:.83rem; color:var(--ink-soft); margin:0 0 8px; line-height:1.45;}
  .concept-card .why{font-size:.76rem; color:var(--muted); font-style:italic; margin:0;}
  .shortlist-toggle{display:flex; align-items:center; gap:7px; margin-top:11px; font-size:.78rem; color:var(--ink-soft);}

  .board{display:grid; grid-template-columns:repeat(4,1fr); gap:14px; margin-bottom:26px;}
  @media (max-width:760px){.board{grid-template-columns:1fr 1fr;}}
  .bucket{border-radius:10px; padding:14px; border:1px solid var(--border); background:var(--surface-2); border-top-width:4px;}
  .bucket h4{font-family:var(--font-mono); font-size:.7rem; text-transform:uppercase; letter-spacing:.06em; margin:0 0 4px;}
  .bucket .bucket-sub{font-size:.72rem; color:var(--muted); margin:0 0 10px;}
  .bucket.no-regrets{border-top-color:var(--moss);}
  .bucket.option{border-top-color:var(--teal);}
  .bucket.hedge{border-top-color:var(--brass);}
  .bucket.big-bet{border-top-color:var(--vermilion);}
  .chip{background:var(--surface); border:1px solid var(--border); border-radius:8px; padding:9px 10px; font-size:.79rem; margin-bottom:8px;}
  .chip b{display:block; margin-bottom:3px;}
  .chip .rationale{color:var(--muted); font-size:.74rem; line-height:1.35;}

  .threads-list, .tripwire-list{display:flex; flex-direction:column; gap:10px; margin-bottom:8px;}
  .thread-item, .tripwire-item{background:var(--surface-2); border:1px solid var(--border); border-radius:8px; padding:12px 14px; font-size:.85rem;}
  .thread-item b, .tripwire-item b{font-size:.9rem;}
  .tripwire-item .guess{font-family:var(--font-mono); font-size:.73rem; color:var(--teal); margin-top:6px; display:block;}
  .section-heading{font-family:var(--font-display); font-style:italic; font-size:1.3rem; margin:0 0 14px; color:var(--ink);}
  .subsection-heading{font-family:var(--font-mono); font-size:.72rem; text-transform:uppercase; letter-spacing:.07em; color:var(--muted); margin:26px 0 12px;}

  .foot{display:flex; justify-content:space-between; align-items:center; margin-top:34px; padding-top:16px; border-top:1px solid var(--border); font-size:.8rem; color:var(--muted); flex-wrap:wrap; gap:10px;}

  .welcome{background:var(--surface-2); border:1px solid var(--brass); border-radius:10px; padding:18px 20px; margin-bottom:22px;}
  .welcome h3{font-family:var(--font-display); font-style:italic; font-size:1.15rem; margin:0 0 8px; color:var(--ink);}
  .welcome ol{margin:10px 0 0; padding-left:20px; font-size:.85rem; color:var(--ink-soft); line-height:1.7;}
  .welcome ol b{color:var(--ink); font-weight:600;}
  .welcome .time{font-family:var(--font-mono); font-size:.72rem; color:var(--brass);}
  .welcome-dismiss{margin-top:12px;}
  .field-error{font-size:.8rem; color:var(--vermilion); margin:-8px 0 14px;}

  .mini{font-size:.78rem; color:var(--muted); line-height:1.45; margin:0 0 10px;}
  .mini.err{color:var(--vermilion);}
  .discuss .btn{width:100%;}
  .art{border-radius:8px; overflow:hidden; border:1px solid var(--border); background:var(--surface); margin-bottom:12px; aspect-ratio:8/5;}
  .art img{display:block; width:100%; height:100%; object-fit:cover;}
  .art.sketch{aspect-ratio:3/2; background:#ffffff;}
  .art.sketch img{object-fit:contain;}
  .art-empty{display:flex; align-items:center; justify-content:center; height:100%; font-family:var(--font-mono); font-size:.66rem; color:var(--muted); text-transform:uppercase; letter-spacing:.06em; text-align:center; padding:8px;}
  .art-bar{display:flex; gap:14px; align-items:center; flex-wrap:wrap; padding:12px 14px; margin-bottom:18px; background:var(--surface-2); border:1px dashed var(--border); border-radius:8px;}
  .art-bar p{margin:0; font-size:.82rem; color:var(--ink-soft); flex:1; min-width:220px; line-height:1.45;}
  .concept-card .btn{margin-top:10px;}
  .discuss .mini:last-child{margin:10px 0 0;}
  details.transcript{margin-top:14px; border-top:1px dashed var(--border); padding-top:12px;}
  details.transcript summary{cursor:pointer; font-weight:600; font-size:.85rem; color:var(--teal);}
  details.transcript[open] summary{margin-bottom:8px;}
  .file-row{margin:8px 0;}
  .file-row input[type=file]{font-size:.78rem; width:100%;}
  .digest{margin-top:14px; padding:12px; background:var(--surface); border:1px solid var(--border); border-radius:8px;}
  .digest h4{font-family:var(--font-mono); font-size:.66rem; text-transform:uppercase; letter-spacing:.07em; color:var(--teal); margin:10px 0 4px;}
  .digest h4:first-child{margin-top:0;}
  .digest ul{margin:0; padding-left:18px; font-size:.8rem; color:var(--ink-soft); line-height:1.5;}
  .digest .routed{font-size:.76rem; color:var(--brass); margin:10px 0 0; line-height:1.4;}

  @media (prefers-reduced-motion: reduce){
    *{transition:none !important; animation:none !important;}
    button.btn:hover:not(:disabled){transform:none;}
  }
</style>

<div class="app" id="app">
  <header class="topbar">
    <div class="brand">
      <span class="brand-mark">&#10022;</span>
      <div>
        <h1>Futures Compass</h1>
        <p class="tagline">A staged instrument for design-forward scenario planning — Claude does the legwork at each waypoint, you keep the compass and choose what carries forward.</p>
      </div>
    </div>
    <div class="ai-note" id="ai-banner" hidden></div>
  </header>

  <nav class="course" id="course"></nav>
  <div class="wire" id="wire" hidden>
    <div class="wire-body">
      <span class="wire-label" id="wire-label">Working…</span>
      <pre id="wire-text"></pre>
    </div>
    <button class="btn ghost small" id="wire-stop">Stop</button>
  </div>

  <main class="deck">
    <section class="canvas" id="canvas"></section>
    <aside class="rail" id="rail"></aside>
  </main>

  <footer class="foot">
    <span>Reasoning runs on your own Claude usage from inside this page.</span>
    <button class="linklike" id="reset-btn">Start a new domain</button>
  </footer>
</div>

<script src="https://cdn.jsdelivr.net/npm/pptxgenjs@3.12.0/dist/pptxgen.bundle.js"></script>
<script>
(function(){
  "use strict";

  var STAGES = [
    {key:'domain', label:'Domain', num:'01', time:'~2 min', blurb:'Describe the problem space and horizon yourself.'},
    {key:'drivers', label:'Drivers', num:'02', time:'~1-2 min', blurb:'Claude researches forces, then you pick two as axes.'},
    {key:'futures', label:'Futures', num:'03', time:'~2 min', blurb:'Claude drafts four "in a world where..." stories.'},
    {key:'concepts', label:'Concepts', num:'04', time:'~2 min', blurb:'Claude proposes ideas per future; you shortlist.'},
    {key:'strategy', label:'Strategy', num:'05', time:'~1 min', blurb:'Claude sorts your picks into a strategy board.'}
  ];
  var STORAGE_KEY = 'futures-compass-state-v1';

  var EXAMPLE_PRESET = {
    problem: "How will restaurant dining experiences evolve as customers' comfort with technology and restaurants' economic pressures both shift?",
    horizon: "The next two to three years",
    perspective: "Written from the point of view of a mid-sized restaurant group. We can shape menus, ordering, and service design, but not commercial rents, immigration policy, or the broader economy, even though those forces still bound what's possible."
  };

  function defaultState(){
    return {
      stage: 'domain',
      reached: {domain:true, drivers:false, futures:false, concepts:false, strategy:false},
      aiUnavailable: false,
      aiUnavailableReason: '',
      busy: false,
      wireLabel: '',
      wireText: '',
      lastError: '',
      welcomeDismissed: false,
      isExample: true,
      domain: {problem: EXAMPLE_PRESET.problem, horizon: EXAMPLE_PRESET.horizon, perspective: EXAMPLE_PRESET.perspective},
      drivers: {items: [], axisIds: [], notes: '', hint: ''},
      futures: {axisA: null, axisB: null, quadrants: [], notes: '', stale: false},
      concepts: {list: [], notes: '', stale: false},
      strategy: {classification: [], threads: [], tripwires: [], notes: '', stale: false},
      digests: {},
      seq: {driver: 1, concept: 1}
    };
  }

  var state = loadLocal() || defaultState();
  if (!state.digests) state.digests = {};
  // busy/wire fields describe an in-flight Claude call, which cannot survive a page reload —
  // an old session that closed mid-call must never come back permanently "stuck".
  state.busy = false; state.wireLabel = ''; state.wireText = ''; state.lastError = '';
  var sampleApi = null;
  var downloadsApi = null;
  var activeController = null;
  var editingQuadrantId = null;

  function saveLocal(){
    try{
      var toSave = JSON.parse(JSON.stringify(state));
      toSave.busy = false; toSave.wireLabel = ''; toSave.wireText = ''; toSave.lastError = '';
      localStorage.setItem(STORAGE_KEY, JSON.stringify(toSave));
    }catch(e){}
  }
  function loadLocal(){ try{ var raw = localStorage.getItem(STORAGE_KEY); return raw ? JSON.parse(raw) : null; }catch(e){ return null; } }

  function el(tag, attrs){
    var node = document.createElement(tag);
    attrs = attrs || {};
    for (var k in attrs){
      if (!Object.prototype.hasOwnProperty.call(attrs, k)) continue;
      var v = attrs[k];
      if (k === 'class') node.className = v;
      else if (k === 'html') node.innerHTML = v;
      else if (k.indexOf('on') === 0 && typeof v === 'function') node.addEventListener(k.slice(2), v);
      else if (v !== false && v != null) node.setAttribute(k, v === true ? '' : v);
    }
    for (var i = 2; i < arguments.length; i++){
      var c = arguments[i];
      if (c == null) continue;
      if (Array.isArray(c)) { for (var j=0;j<c.length;j++) appendChild(node, c[j]); }
      else appendChild(node, c);
    }
    return node;
  }
  function appendChild(node, c){
    if (c == null) return;
    node.appendChild(typeof c === 'string' ? document.createTextNode(c) : c);
  }
  function clamp15(v){ v = Math.round(Number(v)); if (isNaN(v)) return 3; return Math.max(1, Math.min(5, v)); }
  function slug(s){ return String(s||'domain').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/(^-|-$)/g,'').slice(0,40) || 'domain'; }
  function getDriver(id){ for (var i=0;i<state.drivers.items.length;i++) if (state.drivers.items[i].id===id) return state.drivers.items[i]; return null; }
  function findQuad(aPole,bPole){ for (var i=0;i<state.futures.quadrants.length;i++){ var q=state.futures.quadrants[i]; if (q.axisAPole===aPole && q.axisBPole===bPole) return q; } return null; }
  function quadTitleById(id){ for (var i=0;i<state.futures.quadrants.length;i++) if (state.futures.quadrants[i].id===id) return state.futures.quadrants[i].title; return id; }

  function markStale(from){
    var order = ['drivers','futures','concepts','strategy'];
    var idx = order.indexOf(from);
    for (var i=idx+1;i<order.length;i++){
      var key = order[i];
      if (key==='futures' && state.futures.quadrants.length) state.futures.stale = true;
      if (key==='concepts' && state.concepts.list.length) state.concepts.stale = true;
      if (key==='strategy' && state.strategy.classification.length) state.strategy.stale = true;
    }
  }

  // ---------- Claude capability wiring ----------
  function useCap(name){
    return Promise.resolve().then(function(){
      if (!window.claude || typeof window.claude.use !== 'function') return null;
      return window.claude.use(name);
    }).catch(function(){ return null; });
  }

  function callSample(opts){
    if (!sampleApi){ var e = {code:'not_declared', message:'Sample capability unavailable.'}; return Promise.reject(e); }
    var callOpts = {signal: opts.signal, cache:false, modelTier: opts.tier || 'default'};
    if (opts.onStream) callOpts.onText = function(u){ opts.onStream(u.text); };
    if (opts.asJson) return sampleApi.json(opts.prompt, callOpts);
    return sampleApi(opts.prompt, callOpts).then(function(r){ return r.text; });
  }

  var PERMANENT_CODES = {not_granted:1, sampling_disabled:1, not_declared:1, capability_disabled:1, capability_removed:1};
  function friendlyError(e){
    var code = e && e.code;
    if (PERMANENT_CODES[code]){
      state.aiUnavailable = true;
      state.aiUnavailableReason = code === 'not_granted'
        ? "Permission to consult Claude wasn't granted, so each stage below runs manually — fill it in yourself."
        : "The research assistant isn't available in this view, so each stage below runs manually — fill it in yourself.";
      return '';
    }
    if (code === 'cancelled') return '';
    var map = {
      rate_limited: "Claude is busy right now — wait a moment and try again.",
      prompt_too_large: "That request was too long — shorten your notes and try again.",
      invalid_json: "The reply didn't come back as clean data — try again.",
      refused: "Claude declined that request — try rephrasing your notes.",
      empty_completion: "Claude didn't return anything usable — try again.",
      images_unavailable: "Images aren't used here.",
      session_expired: "Your session expired — reload the page and sign in again."
    };
    return map[code] || ((e && e.message) || "Something went wrong talking to Claude — try again.");
  }

  function withBusy(label, work){
    if (state.busy) return;
    state.busy = true; state.wireLabel = label; state.wireText = ''; state.lastError = '';
    var ctl = new AbortController();
    activeController = ctl;
    render();
    work(ctl.signal, function(text){ state.wireText = text; paintWire(); }).catch(function(err){
      state.lastError = friendlyError(err);
    }).then(function(){
      state.busy = false; activeController = null; saveLocal(); render();
    });
  }

  // ---------- Prompt builders ----------
  function domainBlock(){
    return "DOMAIN\nProblem space: " + state.domain.problem +
      "\nTime horizon: " + state.domain.horizon +
      "\nPerspective (what this organization can and can't act on): " + (state.domain.perspective || '(not specified)');
  }

  function buildDriversPrompt(notes, isRegen){
    var existing = state.drivers.items.map(function(d){ return d.name; }).join(', ');
    return "You are a rigorous scenario-planning research analyst helping scope a design-forward foresight exercise.\n\n" +
      domainBlock() + "\n\n" +
      "TASK\nList the driving forces most relevant to how this domain could unfold over the stated horizon. Draw on technological, economic, social, and institutional angles. For each force estimate:\n" +
      "- impact: how much it would shape outcomes in this domain, 1 (marginal) to 5 (defining)\n" +
      "- uncertainty: how unpredictable its direction or magnitude is from today's vantage point, 1 (nearly certain) to 5 (wide open)\n" +
      "Prefer forces that are impactful AND uncertain over ones that are merely important.\n" +
      (isRegen ? ("\nThis replaces an earlier list (" + existing + "). Take a genuinely different cut.\n") : "") +
      (notes ? ("\nAdditional guidance from the strategist: " + notes + "\n") : "") +
      "\nReply with only a JSON array of 8 to 10 objects, each: {\"name\": short label (5 words max), \"description\": one sentence, \"impact\": integer 1-5, \"uncertainty\": integer 1-5}. No other text.";
  }

  function buildFuturesPrompt(notes, isRegen){
    var a = getDriver(state.drivers.axisIds[0]);
    var b = getDriver(state.drivers.axisIds[1]);
    return "You are running a design-forward scenario-planning workshop — a lightweight, narrative variant of the classic 2x2 scenario matrix.\n\n" +
      domainBlock() + "\n\n" +
      "CHOSEN AXES (the two most impactful and uncertain driving forces)\nAxis A — " + a.name + ": " + a.description +
      "\nAxis B — " + b.name + ": " + b.description + "\n\n" +
      "TASK\n1. Name each axis's two opposite poles in a few words.\n" +
      "2. Write four future scenarios, one for each corner of the grid formed by crossing the two axes' poles. Each should read like the start of an \"in a world where...\" story: vivid, concrete, plausible, 3-4 sentences, naming what a person would actually notice. Then list 2-3 observable signals that would tell someone this future is arriving.\n" +
      (isRegen ? "\nThis replaces an earlier set of four futures. Take a genuinely different angle.\n" : "") +
      (notes ? ("\nAdditional guidance from the strategist: " + notes + "\n") : "") +
      "\nReply with only this JSON shape, no other text:\n" +
      "{\"axisA\":{\"name\":\"...\",\"poleHigh\":\"...\",\"poleLow\":\"...\"},\"axisB\":{\"name\":\"...\",\"poleHigh\":\"...\",\"poleLow\":\"...\"}," +
      "\"quadrants\":[{\"axisAPole\":\"high\",\"axisBPole\":\"high\",\"title\":\"...\",\"narrative\":\"...\",\"signals\":[\"...\",\"...\"]}," +
      "{\"axisAPole\":\"high\",\"axisBPole\":\"low\",\"title\":\"...\",\"narrative\":\"...\",\"signals\":[\"...\"]}," +
      "{\"axisAPole\":\"low\",\"axisBPole\":\"high\",\"title\":\"...\",\"narrative\":\"...\",\"signals\":[\"...\"]}," +
      "{\"axisAPole\":\"low\",\"axisBPole\":\"low\",\"title\":\"...\",\"narrative\":\"...\",\"signals\":[\"...\"]}]}";
  }

  function buildQuadrantRegenPrompt(target, notes){
    var others = state.futures.quadrants.filter(function(q){ return q.id !== target.id; })
      .map(function(q){ return "- " + q.title + ": " + q.narrative; }).join('\n');
    return "You are refining one quadrant of a four-quadrant scenario-planning matrix; keep it consistent with the other three.\n\n" +
      domainBlock() + "\n\n" +
      "Axis A (" + state.futures.axisA.name + "): pole for this quadrant = " + (target.axisAPole==='high'?state.futures.axisA.poleHigh:state.futures.axisA.poleLow) + "\n" +
      "Axis B (" + state.futures.axisB.name + "): pole for this quadrant = " + (target.axisBPole==='high'?state.futures.axisB.poleHigh:state.futures.axisB.poleLow) + "\n\n" +
      "THE OTHER THREE QUADRANTS (for contrast, do not repeat their content)\n" + others + "\n\n" +
      "CURRENT DRAFT OF THIS QUADRANT\n" + target.title + ": " + target.narrative + "\n\n" +
      (notes ? ("Guidance from the strategist: " + notes + "\n\n") : "") +
      "Rewrite just this quadrant: a vivid \"in a world where...\" narrative, 3-4 sentences, plus 2-3 observable signals.\n" +
      "Reply with only this JSON shape: {\"title\":\"...\",\"narrative\":\"...\",\"signals\":[\"...\",\"...\"]}";
  }

  function buildCritiquePrompt(target){
    return "You are a skeptical scenario-planning critic. Be concrete and a little uncomfortable — the goal is to make the team defend or fix the story, not to be nice.\n\n" +
      "SCENARIO\n" + target.title + ": " + target.narrative + "\n\n" +
      "In 2-3 sentences, say what's generic, implausible, or hand-wavy about this scenario, and what would need to be true for it to be more convincing. Plain text only, no headers, no JSON.";
  }

  function buildConceptsPrompt(notes, isRegen){
    var scenarioList = state.futures.quadrants.map(function(q){ return "[" + q.id + "] " + q.title + ": " + q.narrative; }).join('\n');
    return "You are helping a design team \"embody\" solutions for a scenario-planning exercise — concrete concepts that make a future tangible enough to argue about.\n\n" +
      domainBlock() + "\n\nSCENARIOS\n" + scenarioList + "\n\n" +
      "TASK\nFor EACH scenario id listed above, propose 2 to 3 concept ideas a team would build if that future arrived — an interface, product feature, service, or communication — concrete enough to sketch, not a strategy statement. For each: a short name, a one-paragraph pitch a stakeholder could react to, and one sentence on why it specifically fits that world (not a generic idea that fits any world).\n" +
      (isRegen ? "\nThis replaces an earlier set of concepts. Take a different angle.\n" : "") +
      (notes ? ("\nAdditional guidance from the strategist: " + notes + "\n") : "") +
      "\nReply with only a JSON array of objects: {\"scenarioId\": one of the ids above exactly, \"name\":\"...\",\"pitch\":\"...\",\"whyThisWorld\":\"...\"}. No other text.";
  }

  function buildStrategyPrompt(notes, isRegen){
    var scenarioList = state.futures.quadrants.map(function(q){ return "[" + q.id + "] " + q.title; }).join('\n');
    var shortlisted = state.concepts.list.filter(function(c){ return c.shortlisted; });
    var conceptList = shortlisted.map(function(c){ return "[" + c.id + "] (from " + c.scenarioId + ") " + c.name + ": " + c.pitch; }).join('\n');
    return "You are closing out a design-forward scenario-planning exercise using the Strategic Flexibility Matrix from decision-quality practice: every candidate move is a no-regrets bet (pays off in every scenario, do it now), an option (small, cheap, keeps a door open), a hedge (meaningful commitment that pays off in more than one scenario but not all), or a big bet (large commitment that only pays off if a specific scenario arrives — defer until a signpost lights up).\n\n" +
      domainBlock() + "\n\nSCENARIOS\n" + scenarioList + "\n\nSHORTLISTED CONCEPTS\n" + conceptList + "\n\n" +
      "TASK\n1. Classify EACH shortlisted concept above into exactly one bucket: \"no-regrets\", \"option\", \"hedge\", or \"big-bet\", with a one-sentence rationale grounded in how many scenarios it would pay off in.\n" +
      "2. Identify 2-4 cross-scenario threads: common capabilities or investments implied by multiple concepts or scenarios regardless of which future arrives.\n" +
      "3. Propose 3-5 tripwire signals worth monitoring now — concrete, observable indicators (survey trends, usage data, published research) that would tell the organization which scenario is emerging, each with why it matters and a one-line guess at which direction it's currently trending.\n" +
      (isRegen ? "\nThis replaces an earlier synthesis. Take a different angle.\n" : "") +
      (notes ? ("\nAdditional guidance from the strategist: " + notes + "\n") : "") +
      "\nReply with only this JSON shape, no other text:\n{\"classification\":[{\"conceptId\":\"...\",\"bucket\":\"no-regrets|option|hedge|big-bet\",\"rationale\":\"...\"}],\"threads\":[{\"name\":\"...\",\"description\":\"...\"}],\"tripwires\":[{\"signal\":\"...\",\"whyItMatters\":\"...\",\"currentGuess\":\"...\"}]}";
  }

  // ---------- Stage actions ----------
  function researchDrivers(){
    var notesEl = document.getElementById('drivers-notes');
    var notes = notesEl ? notesEl.value : state.drivers.notes;
    state.drivers.notes = notes;
    var isRegen = state.drivers.items.length > 0;
    withBusy(isRegen ? 'Re-researching driving forces…' : 'Researching driving forces…', function(signal, onStream){
      var prompt = buildDriversPrompt(notes, isRegen);
      return callSample({prompt: prompt, asJson: true, signal: signal, onStream: onStream}).then(function(data){
        var arr = Array.isArray(data) ? data : [];
        state.drivers.items = arr.map(function(d){
          return {
            id: 'd' + (state.seq.driver++),
            name: String((d && d.name) || 'Untitled force').slice(0,80),
            description: String((d && d.description) || ''),
            impact: clamp15(d && d.impact),
            uncertainty: clamp15(d && d.uncertainty)
          };
        });
        state.drivers.axisIds = [];
        markStale('drivers');
      });
    });
  }

  function addDriverManually(){
    var nameEl = document.getElementById('new-driver-name');
    var descEl = document.getElementById('new-driver-desc');
    var name = nameEl.value.trim();
    if (!name) return;
    state.drivers.items.push({id:'d'+(state.seq.driver++), name:name, description:descEl.value.trim(), impact:3, uncertainty:3});
    markStale('drivers');
    render();
  }

  function toggleAxis(id){
    var idx = state.drivers.axisIds.indexOf(id);
    if (idx >= 0){ state.drivers.axisIds.splice(idx,1); state.drivers.hint=''; }
    else if (state.drivers.axisIds.length < 2){ state.drivers.axisIds.push(id); state.drivers.hint=''; }
    else { state.drivers.hint = 'Two axes are already chosen — deselect one first.'; }
    markStale('drivers');
    render();
  }

  function generateFutures(){
    var notesEl = document.getElementById('futures-notes');
    var notes = notesEl ? notesEl.value : state.futures.notes;
    state.futures.notes = notes;
    var isRegen = state.futures.quadrants.length > 0;
    withBusy(isRegen ? 'Re-drafting the four futures…' : 'Drafting the four futures…', function(signal, onStream){
      var prompt = buildFuturesPrompt(notes, isRegen);
      return callSample({prompt: prompt, asJson: true, signal: signal, onStream: onStream}).then(function(data){
        state.futures.axisA = (data && data.axisA) || {name:'Axis A', poleHigh:'High', poleLow:'Low'};
        state.futures.axisB = (data && data.axisB) || {name:'Axis B', poleHigh:'High', poleLow:'Low'};
        var quads = (data && data.quadrants) || [];
        state.futures.quadrants = quads.map(function(q){
          var aPole = q.axisAPole === 'low' ? 'low' : 'high';
          var bPole = q.axisBPole === 'low' ? 'low' : 'high';
          return {
            id: aPole + '_' + bPole,
            axisAPole: aPole, axisBPole: bPole,
            title: String(q.title || 'Untitled future'),
            narrative: String(q.narrative || ''),
            signals: Array.isArray(q.signals) ? q.signals.map(String) : [],
            critique: ''
          };
        });
        state.futures.stale = false;
        markStale('futures');
      });
    });
  }

  function regenerateQuadrant(id){
    var target = null;
    for (var i=0;i<state.futures.quadrants.length;i++) if (state.futures.quadrants[i].id===id) target = state.futures.quadrants[i];
    if (!target) return;
    var notesEl = document.getElementById('futures-notes');
    var notes = notesEl ? notesEl.value : state.futures.notes;
    withBusy('Redrafting one quadrant…', function(signal, onStream){
      var prompt = buildQuadrantRegenPrompt(target, notes);
      return callSample({prompt: prompt, asJson: true, signal: signal, onStream: onStream}).then(function(data){
        target.title = String((data && data.title) || target.title);
        target.narrative = String((data && data.narrative) || target.narrative);
        target.signals = Array.isArray(data && data.signals) ? data.signals.map(String) : target.signals;
        target.critique = '';
        target.image = '';
        markStale('futures');
      });
    });
  }

  function challengeQuadrant(id){
    var target = null;
    for (var i=0;i<state.futures.quadrants.length;i++) if (state.futures.quadrants[i].id===id) target = state.futures.quadrants[i];
    if (!target) return;
    withBusy('Consulting the critic…', function(signal, onStream){
      var prompt = buildCritiquePrompt(target);
      return callSample({prompt: prompt, asJson: false, signal: signal, onStream: onStream}).then(function(text){
        target.critique = text;
      });
    });
  }

  function saveQuadrantEdit(id, titleVal, narrativeVal){
    var target = null;
    for (var i=0;i<state.futures.quadrants.length;i++) if (state.futures.quadrants[i].id===id) target = state.futures.quadrants[i];
    if (!target) return;
    target.title = titleVal.trim() || target.title;
    target.narrative = narrativeVal.trim();
    editingQuadrantId = null;
    markStale('futures');
    render();
  }

  function generateConcepts(){
    var notesEl = document.getElementById('concepts-notes');
    var notes = notesEl ? notesEl.value : state.concepts.notes;
    state.concepts.notes = notes;
    var isRegen = state.concepts.list.length > 0;
    withBusy(isRegen ? 'Re-proposing concepts…' : 'Proposing solution concepts…', function(signal, onStream){
      var prompt = buildConceptsPrompt(notes, isRegen);
      return callSample({prompt: prompt, asJson: true, signal: signal, onStream: onStream}).then(function(data){
        var arr = Array.isArray(data) ? data : [];
        var validIds = state.futures.quadrants.map(function(q){ return q.id; });
        state.concepts.list = arr.filter(function(c){ return validIds.indexOf(c.scenarioId) >= 0; }).map(function(c){
          return {
            id: 'c' + (state.seq.concept++),
            scenarioId: c.scenarioId,
            name: String(c.name || 'Untitled concept'),
            pitch: String(c.pitch || ''),
            whyThisWorld: String(c.whyThisWorld || ''),
            shortlisted: false
          };
        });
        state.concepts.stale = false;
        markStale('concepts');
      });
    });
  }

  function toggleShortlist(id){
    for (var i=0;i<state.concepts.list.length;i++) if (state.concepts.list[i].id===id) state.concepts.list[i].shortlisted = !state.concepts.list[i].shortlisted;
    markStale('concepts');
    render();
  }

  function synthesizeStrategy(){
    var notesEl = document.getElementById('strategy-notes');
    var notes = notesEl ? notesEl.value : state.strategy.notes;
    state.strategy.notes = notes;
    var isRegen = state.strategy.classification.length > 0;
    withBusy(isRegen ? 'Re-synthesizing strategy…' : 'Synthesizing strategy…', function(signal, onStream){
      var prompt = buildStrategyPrompt(notes, isRegen);
      return callSample({prompt: prompt, asJson: true, signal: signal, onStream: onStream}).then(function(data){
        state.strategy.classification = Array.isArray(data && data.classification) ? data.classification : [];
        state.strategy.threads = Array.isArray(data && data.threads) ? data.threads : [];
        state.strategy.tripwires = Array.isArray(data && data.tripwires) ? data.tripwires : [];
        state.strategy.stale = false;
      });
    });
  }

  function buildMarkdownReport(){
    var lines = [];
    lines.push('# Futures Compass — ' + state.domain.problem);
    lines.push('');
    lines.push('**Time horizon:** ' + state.domain.horizon);
    lines.push('**Perspective:** ' + state.domain.perspective);
    lines.push('');
    lines.push('## Drivers chosen as axes');
    state.drivers.axisIds.forEach(function(id){
      var d = getDriver(id);
      if (d) lines.push('- **' + d.name + '** (impact ' + d.impact + '/5, uncertainty ' + d.uncertainty + '/5) — ' + d.description);
    });
    lines.push('');
    lines.push('## The four futures');
    state.futures.quadrants.forEach(function(q){
      lines.push('### ' + q.title);
      lines.push(q.narrative);
      if (q.signals.length) lines.push('*Signals to watch:* ' + q.signals.join('; '));
      if (q.critique) lines.push('> Critic’s note: ' + q.critique);
      lines.push('');
    });
    lines.push('## Concepts');
    state.futures.quadrants.forEach(function(q){
      var cs = state.concepts.list.filter(function(c){ return c.scenarioId === q.id; });
      if (!cs.length) return;
      lines.push('**' + q.title + '**');
      cs.forEach(function(c){
        lines.push('- ' + (c.shortlisted ? '[shortlisted] ' : '') + c.name + ' — ' + c.pitch + ' (' + c.whyThisWorld + ')');
      });
    });
    lines.push('');
    lines.push('## Strategic flexibility matrix');
    ['no-regrets','option','hedge','big-bet'].forEach(function(bucket){
      var items = state.strategy.classification.filter(function(c){ return c.bucket === bucket; });
      if (!items.length) return;
      lines.push('**' + bucket + '**');
      items.forEach(function(it){
        var c = null;
        for (var i=0;i<state.concepts.list.length;i++) if (state.concepts.list[i].id===it.conceptId) c = state.concepts.list[i];
        lines.push('- ' + (c ? c.name : it.conceptId) + ' — ' + it.rationale);
      });
    });
    lines.push('');
    lines.push('## Cross-scenario threads');
    state.strategy.threads.forEach(function(t){ lines.push('- **' + t.name + '**: ' + t.description); });
    lines.push('');
    lines.push('## Tripwires to monitor');
    state.strategy.tripwires.forEach(function(t){ lines.push('- ' + t.signal + ' — ' + t.whyItMatters + ' (currently: ' + t.currentGuess + ')'); });
    lines.push('');
    lines.push('_Generated with Futures Compass, a design-forward scenario-planning instrument._');
    return lines.join('\n');
  }

  function exportMarkdown(){
    if (!downloadsApi){
      state.lastError = "Downloads aren't available in this view — copy the text from the page instead.";
      render();
      return;
    }
    downloadsApi.save({filename: 'futures-compass-' + slug(state.domain.problem) + '.md', data: buildMarkdownReport()})
      .catch(function(e){
        if (e && e.code !== 'declined'){ state.lastError = 'Could not save the file — try again.'; render(); }
      });
  }

  var resetArmed = false;
  var resetArmTimer = null;
  function resetApp(){
    // window.confirm() is unreliable inside a sandboxed artifact frame — it can silently
    // no-op instead of showing a dialog. Use a two-click, in-page confirm instead.
    var btn = document.getElementById('reset-btn');
    if (!resetArmed){
      resetArmed = true;
      btn.textContent = 'Click again to confirm — this clears everything';
      clearTimeout(resetArmTimer);
      resetArmTimer = setTimeout(function(){ resetArmed = false; btn.textContent = 'Start a new domain'; }, 4000);
      return;
    }
    clearTimeout(resetArmTimer);
    resetArmed = false;
    btn.textContent = 'Start a new domain';
    state = defaultState();
    state.isExample = false;
    state.domain = {problem:'', horizon:'', perspective:''};
    editingQuadrantId = null;
    saveLocal();
    render();
  }

  // ---------- Rendering ----------
  function paintWire(){
    var pre = document.getElementById('wire-text');
    if (pre) pre.textContent = state.wireText;
  }

  function renderBanner(){
    var b = document.getElementById('ai-banner');
    if (state.aiUnavailable){ b.hidden = false; b.textContent = state.aiUnavailableReason; }
    else { b.hidden = true; }
  }

  function renderCourse(){
    var courseEl = document.getElementById('course');
    courseEl.innerHTML = '';
    STAGES.forEach(function(s, i){
      var reached = state.reached[s.key];
      var current = state.stage === s.key;
      var cls = 'stop' + (current ? ' is-current' : '') + (reached ? ' is-reached' : ' is-locked');
      var btn = el('button', {type:'button', class: cls, disabled: !reached, onclick: function(key){ return function(){ if (state.busy) return; state.stage = key; render(); }; }(s.key)},
        el('span', {class:'stop-num'}, s.num),
        el('span', {class:'stop-dot'}),
        el('span', {class:'stop-label'}, s.label),
        el('span', {class:'stop-time'}, s.time)
      );
      courseEl.appendChild(btn);
      if (i < STAGES.length - 1) courseEl.appendChild(el('span', {class:'course-line'}));
    });
  }

  function renderWire(){

  // ---------- Drawn visuals (SVG made by Claude) ----------

    opacity:1, 'fill-opacity':1, 'stroke-opacity':1, 'stop-opacity':1, 'font-size':1, 'font-weight':1, 'text-anchor':1};
  var SHAPE_TAGS = {path:1, rect:1, circle:1, ellipse:1, line:1, polyline:1, polygon:1, text:1};

  var colorCtx = null;
  function parseColor(v){
    if (!colorCtx){ var cv = document.createElement('canvas'); cv.width = 1; cv.height = 1; colorCtx = cv.getContext('2d'); }
    colorCtx.fillStyle = '#123456';
    colorCtx.fillStyle = v;
    var out = String(colorCtx.fillStyle).toLowerCase();
    var m = out.match(/^#([0-9a-f]{2})([0-9a-f]{2})([0-9a-f]{2})$/);
    if (m){
      if (out === '#123456' && String(v).toLowerCase().replace(/\s/g, '') !== '#123456') return null;
      return [parseInt(m[1], 16), parseInt(m[2], 16), parseInt(m[3], 16)];

  function nearestPalette(rgb){
    var best = FUTURE_COLORS[0], bestD = Infinity;
    FUTURE_COLORS.forEach(function(h){
      var r = parseInt(h.slice(1, 3), 16), g = parseInt(h.slice(3, 5), 16), b = parseInt(h.slice(5, 7), 16);
