      if (axes && stage !== 'domain' && stage !== 'drivers') recapRows.push(['THE TWO AXES', 'A: ' + axes[0] + '     ×     B: ' + axes[1], 18, 0.7, 160]);
      var ry = 1.9;
      recapRows.forEach(function(r){
        rs.addShape(SHAPE.line, {x: 0.6, y: ry - 0.12, w: 12.1, h: 0, line: {color: PAL.border, width: 0.75}});
        rs.addText(r[0], {x: 0.6, y: ry, w: 2.4, h: 0.4, fontFace: FNT.mono, fontSize: 11, color: PAL.brass, charSpacing: 3, margin: 0, valign: 'top'});
        rs.addText(clip(r[1], r[4]), {x: 3.1, y: ry - 0.04, w: 9.6, h: r[3], fontFace: FNT.body, fontSize: r[2], color: PAL.ink, margin: 0, valign: 'top'});
        ry += r[3] + 0.28;
      });

      // --- stage content
      if (stage === 'drivers') addDriverSlides();
      if (stage === 'futures') addFutureSlides();
      if (stage === 'concepts') addConceptSlides();
      if (stage === 'strategy') addStrategySlides();

      function addDriverSlides(){
        var items = state.drivers.items;
        var s = newSlide('The forces', 'Where each force lands');
        var X0 = 1.45, Y0 = 1.8, SZ = 4.5, cell = SZ / 5, i;
        s.addShape(SHAPE.rect, {x: X0 + cell * 3, y: Y0, w: cell * 2, h: cell * 2, fill: {color: PAL.brassSoft, transparency: 30}, line: {color: PAL.brassSoft, width: 0}});
        for (i = 0; i <= 5; i++){
          s.addShape(SHAPE.line, {x: X0 + i * cell, y: Y0, w: 0, h: SZ, line: {color: PAL.border, width: 0.75}});
          s.addShape(SHAPE.line, {x: X0, y: Y0 + i * cell, w: SZ, h: 0, line: {color: PAL.border, width: 0.75}});
        }
        for (i = 1; i <= 5; i++){
          s.addText(String(i), {x: X0 + (i - 0.5) * cell - 0.2, y: Y0 + SZ + 0.04, w: 0.4, h: 0.25, align: 'center', fontFace: FNT.mono, fontSize: 9, color: PAL.muted, margin: 0});
          s.addText(String(i), {x: X0 - 0.35, y: Y0 + SZ - (i - 0.5) * cell - 0.125, w: 0.25, h: 0.25, align: 'center', fontFace: FNT.mono, fontSize: 9, color: PAL.muted, margin: 0});
        }
        s.addText('UNCERTAINTY  →', {x: X0, y: Y0 + SZ + 0.32, w: SZ, h: 0.3, align: 'center', fontFace: FNT.mono, fontSize: 10, color: PAL.teal, charSpacing: 3, margin: 0});
        s.addText('IMPACT  →', {x: 0.1, y: Y0 + SZ / 2 - 0.15, w: 1.3, h: 0.3, align: 'center', rotate: 270, fontFace: FNT.mono, fontSize: 10, color: PAL.brass, charSpacing: 3, margin: 0});
        var groups = {};
        items.forEach(function(d, idx){ var k = d.impact + '|' + d.uncertainty; (groups[k] = groups[k] || []).push(idx); });
        items.forEach(function(d, idx){
          var g = groups[d.impact + '|' + d.uncertainty], n = g.length, pos = g.indexOf(idx);
          var cols = Math.ceil(Math.sqrt(n)), rows = Math.ceil(n / cols), step = 0.34;
          var cx = X0 + (d.uncertainty - 0.5) * cell + ((pos % cols) - (cols - 1) / 2) * step;
          var cy = Y0 + SZ - (d.impact - 0.5) * cell + (Math.floor(pos / cols) - (rows - 1) / 2) * step;
          var isAxis = state.drivers.axisIds.indexOf(d.id) >= 0;
          s.addShape(SHAPE.ellipse, {x: cx - 0.16, y: cy - 0.16, w: 0.32, h: 0.32, fill: {color: isAxis ? PAL.brass : PAL.teal}, line: {color: PAL.white, width: 1}});
          s.addText(String(idx + 1), {x: cx - 0.16, y: cy - 0.16, w: 0.32, h: 0.32, align: 'center', valign: 'middle', fontFace: FNT.body, fontSize: 10, bold: true, color: PAL.white, margin: 0});
        });
        var legend = [];
        items.forEach(function(d, idx){
          var isAxis = state.drivers.axisIds.indexOf(d.id) >= 0;
          legend.push({text: String(idx + 1) + (idx + 1 < 10 ? ' ' : '') + '   ', options: {fontFace: FNT.mono, bold: true, color: isAxis ? PAL.brass : PAL.teal}});
          legend.push({text: clip(d.name, 46) + (isAxis ? '    ★ axis' : ''), options: {color: PAL.ink, bold: isAxis, breakLine: true}});
        });
        s.addText(legend, {x: 6.5, y: 1.8, w: 6.2, h: 4.2, fontFace: FNT.body, fontSize: 14, valign: 'top', margin: 0, paraSpaceAfter: 7});
        s.addText('Shaded corner = high impact and high uncertainty: the natural candidates for our two axes.' + (state.drivers.axisIds.length ? '  ★ marks the current picks.' : ''),
                  {x: 6.5, y: 6.1, w: 6.2, h: 0.6, fontFace: FNT.body, fontSize: 11, italic: true, color: PAL.muted, valign: 'top', margin: 0});
        s.addNotes('Ask the group to find their own top-right corner before you reveal the current picks.');

        for (var start = 0; start < items.length; start += 8){
          var chunk = items.slice(start, start + 8);
          var ds = newSlide('The forces, in words', items.length > 8 ? 'What each force means  (' + (start / 8 + 1) + ' of ' + Math.ceil(items.length / 8) + ')' : 'What each force means');
          var rows2 = [[hcell('#'), hcell('Force'), hcell('Impact'), hcell('Uncertainty'), hcell('Why it matters')]];
          chunk.forEach(function(d, k){
            rows2.push([{text: String(start + k + 1), options: {align: 'center', bold: true}}, {text: clip(d.name, 48), options: {bold: true}},
                        {text: d.impact + ' / 5', options: {align: 'center'}}, {text: d.uncertainty + ' / 5', options: {align: 'center'}}, clip(d.description, 170)]);
          });
          ds.addTable(rows2, Object.assign({}, TABLE_OPTS, {x: 0.6, y: 1.8, w: 12.1, colW: [0.5, 2.9, 0.9, 1.2, 6.6], fontSize: 13}));
        }
      }

      function addFutureSlides(){
        var f = state.futures, ax = axisNames() || ['Axis A', 'Axis B'];
        var order = [findQuad('high', 'high'), findQuad('low', 'high'), findQuad('high', 'low'), findQuad('low', 'low')];
        var s = newSlide('Axis A (columns): ' + clip(ax[0], 40) + '   ·   Axis B (rows): ' + clip(ax[1], 40), 'The four futures');
        var colX = [1.6, 7.1], rowY = [2.2, 4.6], W = 5.4, H = 2.25;
        s.addText(clip(f.axisA.poleHigh, 40), {x: colX[0], y: 1.78, w: W, h: 0.32, align: 'center', fontFace: FNT.body, fontSize: 12, bold: true, color: PAL.brass, margin: 0});
        s.addText(clip(f.axisA.poleLow, 40), {x: colX[1], y: 1.78, w: W, h: 0.32, align: 'center', fontFace: FNT.body, fontSize: 12, bold: true, color: PAL.brass, margin: 0});
        s.addText(clip(f.axisB.poleHigh, 34), {x: 1.15 - 1.1, y: rowY[0] + H / 2 - 0.16, w: 2.2, h: 0.32, align: 'center', rotate: 270, fontFace: FNT.body, fontSize: 12, bold: true, color: PAL.teal, margin: 0});
        s.addText(clip(f.axisB.poleLow, 34), {x: 1.15 - 1.1, y: rowY[1] + H / 2 - 0.16, w: 2.2, h: 0.32, align: 'center', rotate: 270, fontFace: FNT.body, fontSize: 12, bold: true, color: PAL.teal, margin: 0});
        order.forEach(function(q, idx){
          var x = colX[idx % 2], y = rowY[Math.floor(idx / 2)];
          rect(s, x, y, W, H, PAL.white, PAL.border);
          if (!q) return;
          if (imgs['f' + q.id]){
            s.addImage({data: imgs['f' + q.id], x: x + 0.12, y: y + 0.12, w: 2.6, h: 1.625});
            s.addText([
              {text: clip(q.title, 50), options: {fontFace: FNT.display, fontSize: 15, bold: true, italic: true, color: PAL.ink, breakLine: true, paraSpaceAfter: 5}},
              {text: clip(q.narrative, 175), options: {fontFace: FNT.body, fontSize: 11, color: PAL.soft}}
            ], {x: x + 2.8, y: y, w: W - 2.9, h: H, valign: 'top', margin: [10, 6, 8, 6]});
          } else {
            s.addText([
              {text: clip(q.title, 60), options: {fontFace: FNT.display, fontSize: 18, bold: true, italic: true, color: PAL.ink, breakLine: true, paraSpaceAfter: 6}},
              {text: clip(q.narrative, 330), options: {fontFace: FNT.body, fontSize: 12.5, color: PAL.soft}}
            ], {x: x, y: y, w: W, h: H, valign: 'top', margin: [10, 14, 8, 14]});
          }
        });
        s.addNotes('Read the four titles aloud. Ask: which one did you NOT want to be true? That is usually the one worth the most discussion.');

        order.forEach(function(q, idx){
          if (!q) return;
          var fs = newSlide('Future ' + (idx + 1) + ' of 4   ·   ' + clip(q.axisAPole === 'high' ? f.axisA.poleHigh : f.axisA.poleLow, 30) + '  ×  ' + clip(q.axisBPole === 'high' ? f.axisB.poleHigh : f.axisB.poleLow, 30), q.title, 30);
          var pic = imgs['f' + q.id];
          if (pic){
            fs.addImage({data: pic, x: 0.6, y: 1.85, w: 5.6, h: 3.5});
            rect(fs, 0.6, 5.5, 5.6, 1.3, PAL.surface, PAL.border);
            var sig2 = [{text: 'SIGNALS WE WOULD SEE FIRST', options: {fontFace: FNT.mono, fontSize: 9, bold: true, color: PAL.teal, charSpacing: 2, breakLine: true, paraSpaceAfter: 4}}];
            (q.signals.length ? q.signals : ['(none listed)']).slice(0, 3).forEach(function(t){
              sig2.push({text: clip(t, 78), options: {fontFace: FNT.body, fontSize: 11, color: PAL.ink, bullet: true, breakLine: true, paraSpaceAfter: 2}});
            });
            fs.addText(sig2, {x: 0.6, y: 5.5, w: 5.6, h: 1.3, valign: 'top', margin: [8, 12, 4, 12]});
            fs.addText(clip(q.narrative, 620), {x: 6.55, y: 1.85, w: 6.15, h: q.critique ? 3.35 : 4.9, fontFace: FNT.body, fontSize: 15, color: PAL.ink, valign: 'top', margin: 0, lineSpacingMultiple: 1.1});
            if (q.critique){
              rect(fs, 6.55, 5.3, 6.15, 1.5, PAL.vermSoft, PAL.verm);
              fs.addText([{text: 'THE CRITIC SAYS', options: {fontFace: FNT.mono, fontSize: 9, bold: true, color: PAL.verm, charSpacing: 2, breakLine: true, paraSpaceAfter: 3}},
                          {text: clip(q.critique, 250), options: {fontFace: FNT.body, fontSize: 11, color: PAL.ink}}],
                         {x: 6.55, y: 5.3, w: 6.15, h: 1.5, valign: 'top', margin: [8, 12, 4, 12]});
            }
          } else {
            fs.addText(clip(q.narrative, 760), {x: 0.6, y: 1.85, w: 7.5, h: 4.9, fontFace: FNT.body, fontSize: 18, color: PAL.ink, valign: 'top', margin: 0, lineSpacingMultiple: 1.15});
            rect(fs, 8.5, 1.85, 4.2, 2.7, PAL.surface, PAL.border);
            var sig = [{text: 'SIGNALS WE WOULD SEE FIRST', options: {fontFace: FNT.mono, fontSize: 10, bold: true, color: PAL.teal, charSpacing: 2, breakLine: true, paraSpaceAfter: 8}}];
            (q.signals.length ? q.signals : ['(none listed)']).slice(0, 4).forEach(function(t){
              sig.push({text: clip(t, 105), options: {fontFace: FNT.body, fontSize: 12.5, color: PAL.ink, bullet: true, breakLine: true, paraSpaceAfter: 6}});
            });
            fs.addText(sig, {x: 8.5, y: 1.85, w: 4.2, h: 2.7, valign: 'top', margin: [12, 14, 8, 14]});
            if (q.critique){
              rect(fs, 8.5, 4.75, 4.2, 2.0, PAL.vermSoft, PAL.verm);
              fs.addText([{text: 'THE CRITIC SAYS', options: {fontFace: FNT.mono, fontSize: 10, bold: true, color: PAL.verm, charSpacing: 2, breakLine: true, paraSpaceAfter: 6}},
                          {text: clip(q.critique, 300), options: {fontFace: FNT.body, fontSize: 12, color: PAL.ink}}],
                         {x: 8.5, y: 4.75, w: 4.2, h: 2.0, valign: 'top', margin: [12, 14, 8, 14]});
            }
          }
        });
      }

      function addConceptSlides(){
        var quads = [findQuad('high', 'high'), findQuad('low', 'high'), findQuad('high', 'low'), findQuad('low', 'low')].filter(Boolean);
        quads.forEach(function(q, qi){
          var cs = state.concepts.list.filter(function(c){ return c.scenarioId === q.id; });
          for (var start = 0; start < cs.length; start += 3){
            var chunk = cs.slice(start, start + 3);
            var s = newSlide('Concepts   ·   Future ' + (qi + 1) + ' of ' + quads.length + (cs.length > 3 ? '   (' + (start / 3 + 1) + ')' : ''), q.title, 28);
            chunk.forEach(function(c, k){
              var x = 0.6 + k * 4.1, y = 1.85, w = 3.9, h = 4.9;
              rect(s, x, y, w, h, PAL.white, PAL.border);
              rect(s, x, y, w, 0.34, c.shortlisted ? PAL.brass : PAL.surface, c.shortlisted ? PAL.brass : PAL.border);
              s.addText(c.shortlisted ? 'SHORTLISTED' : 'CONCEPT ' + (start + k + 1), {x: x + 0.14, y: y, w: w - 0.28, h: 0.34, valign: 'middle', fontFace: FNT.mono, fontSize: 9.5, bold: true, color: c.shortlisted ? PAL.white : PAL.muted, charSpacing: 2, margin: 0});
              if (imgs['c' + c.id]){
                s.addImage({data: imgs['c' + c.id], x: x + 0.12, y: y + 0.46, w: 3.66, h: 2.44});
                s.addText([
                  {text: clip(c.name, 50), options: {fontFace: FNT.body, fontSize: 14, bold: true, color: PAL.ink, breakLine: true, paraSpaceAfter: 4}},
                  {text: clip(c.pitch, 165), options: {fontFace: FNT.body, fontSize: 11, color: PAL.soft, breakLine: true, paraSpaceAfter: 4}},
                  {text: 'Why this world: ' + clip(c.whyThisWorld, 95), options: {fontFace: FNT.body, fontSize: 9.5, italic: true, color: PAL.muted}}
                ], {x: x, y: y + 2.95, w: w, h: h - 2.95, valign: 'top', margin: [4, 14, 6, 14]});
              } else {
                s.addText([
                  {text: clip(c.name, 70), options: {fontFace: FNT.body, fontSize: 18, bold: true, color: PAL.ink, breakLine: true, paraSpaceAfter: 10}},
                  {text: clip(c.pitch, 330), options: {fontFace: FNT.body, fontSize: 14, color: PAL.soft, breakLine: true, paraSpaceAfter: 10}},
                  {text: 'Why this world: ' + clip(c.whyThisWorld, 170), options: {fontFace: FNT.body, fontSize: 12, italic: true, color: PAL.muted}}
                ], {x: x, y: y + 0.4, w: w, h: h - 0.4, valign: 'top', margin: [10, 14, 8, 14]});
              }
            });
          }
        });
      }

      function addStrategySlides(){
        var cls = state.strategy.classification;
        var s = newSlide('The strategy board', 'What to do now, and what to wait on');
        BUCKETS.forEach(function(b, i){
          var x = 0.6 + i * 3.04, w = 2.92;
          var items = cls.filter(function(c){ return c.bucket === b[0]; });
          rect(s, x, 1.85, w, 0.5, b[3], b[3]);
          s.addText(b[1] + '  (' + items.length + ')', {x: x + 0.12, y: 1.85, w: w - 0.24, h: 0.5, valign: 'middle', fontFace: FNT.mono, fontSize: 12, bold: true, color: PAL.white, charSpacing: 2, margin: 0});
          s.addText(b[2], {x: x, y: 2.4, w: w, h: 0.5, valign: 'top', fontFace: FNT.body, fontSize: 10, italic: true, color: PAL.muted, margin: 0});
          var shown = items.slice(0, 4), n = shown.length, ch = n ? Math.min(1.2, (3.8 - (n - 1) * 0.1) / n) : 0;
          shown.forEach(function(it, k){
            var c = conceptById(it.conceptId), cy = 3.0 + k * (ch + 0.1);
            rect(s, x, cy, w, ch, PAL.white, PAL.border);
            s.addText([{text: clip(c ? c.name : it.conceptId, 44), options: {fontFace: FNT.body, fontSize: 11, bold: true, color: PAL.ink, breakLine: true, paraSpaceAfter: 3}},
                       {text: clip(it.rationale, n <= 2 ? 150 : n === 3 ? 120 : 90), options: {fontFace: FNT.body, fontSize: 9.5, color: PAL.muted}}],
                      {x: x, y: cy, w: w, h: ch, valign: 'top', margin: [6, 9, 4, 9]});
          });
          if (items.length > 4) s.addText('+ ' + (items.length - 4) + ' more — see next slide', {x: x, y: 6.62, w: w, h: 0.25, fontFace: FNT.body, fontSize: 9, italic: true, color: PAL.muted, margin: 0});
        });
        s.addNotes('Before showing the buckets, ask the room to guess which one or two items are no-regrets. Then compare.');

        for (var start = 0; start < cls.length; start += 5){
          var chunk = cls.slice(start, start + 5);
          var ts2 = newSlide('The reasoning', cls.length > 5 ? 'Why each item landed where it did  (' + (start / 5 + 1) + ' of ' + Math.ceil(cls.length / 5) + ')' : 'Why each item landed where it did');
          var rows3 = [[hcell('Concept'), hcell('Bucket'), hcell('From future'), hcell('Rationale')]];
          chunk.forEach(function(it){
            var c = conceptById(it.conceptId), bucket = BUCKETS.filter(function(b){ return b[0] === it.bucket; })[0];
            rows3.push([{text: clip(c ? c.name : it.conceptId, 50), options: {bold: true}}, {text: bucket ? bucket[1] : String(it.bucket).toUpperCase(), options: {bold: true, color: bucket ? bucket[3] : PAL.ink}},
                        clip(c ? quadTitleById(c.scenarioId) : '', 46), clip(it.rationale, 210)]);
          });
          ts2.addTable(rows3, Object.assign({x: 0.6, y: 1.8, w: 12.1, colW: [3.0, 1.4, 2.5, 5.2]}, TABLE_OPTS));
        }

        if (state.strategy.threads.length){
          var th = newSlide('Across all four futures', 'Threads that hold in every world');
          state.strategy.threads.slice(0, 4).forEach(function(t, i){
            var x = 0.6 + (i % 2) * 6.15, y = 1.85 + Math.floor(i / 2) * 2.55;
            rect(th, x, y, 5.95, 2.4, PAL.white, PAL.border);
            th.addText([{text: clip(t.name, 60), options: {fontFace: FNT.display, fontSize: 18, italic: true, bold: true, color: PAL.ink, breakLine: true, paraSpaceAfter: 8}},
                        {text: clip(t.description, 280), options: {fontFace: FNT.body, fontSize: 13, color: PAL.soft}}],
                       {x: x, y: y, w: 5.95, h: 2.4, valign: 'top', margin: [12, 16, 8, 16]});
          });
        }
        var tws = state.strategy.tripwires;
        for (var st = 0; st < tws.length; st += 5){
          var tchunk = tws.slice(st, st + 5);
          var tw = newSlide('Tripwires', tws.length > 5 ? 'What we would watch, and what it would tell us  (' + (st / 5 + 1) + ' of ' + Math.ceil(tws.length / 5) + ')' : 'What we would watch, and what it would tell us');
          var rows4 = [[hcell('Signal'), hcell('Why it matters'), hcell('Currently trending')]];
          tchunk.forEach(function(t){ rows4.push([{text: clip(t.signal, 120), options: {bold: true}}, clip(t.whyItMatters, 190), clip(t.currentGuess, 150)]); });
          tw.addTable(rows4, Object.assign({x: 0.6, y: 1.8, w: 12.1, colW: [3.8, 4.7, 3.6]}, TABLE_OPTS));
        }
      }

      // --- discussion prompts
      var ps = newSlide('Discussion', 'Questions for the room');
      var pr = [];
      DECK_PROMPTS[stage].forEach(function(q){
        pr.push({text: q, options: {color: PAL.ink, bullet: {type: 'number', indent: 34}, breakLine: true}});
      });
      ps.addText(pr, {x: 0.6, y: 1.85, w: 7.9, h: 4.9, fontFace: FNT.body, fontSize: 20, valign: 'top', margin: 0, paraSpaceAfter: 18});
      rect(ps, 9.0, 1.85, 3.7, 2.9, PAL.surface, PAL.border);
      ps.addText([{text: 'A 25-MINUTE FLOW', options: {fontFace: FNT.mono, fontSize: 10, bold: true, color: PAL.teal, charSpacing: 2, breakLine: true, paraSpaceAfter: 10}},
                  {text: '0 – 5 min', options: {bold: true, color: PAL.ink, breakLine: true}}, {text: 'Read the slides in silence', options: {color: PAL.soft, breakLine: true, paraSpaceAfter: 10}},
                  {text: '5 – 20 min', options: {bold: true, color: PAL.ink, breakLine: true}}, {text: 'Work through the questions', options: {color: PAL.soft, breakLine: true, paraSpaceAfter: 10}},
                  {text: '20 – 25 min', options: {bold: true, color: PAL.ink, breakLine: true}}, {text: 'Fill in the last slide, out loud', options: {color: PAL.soft}}],
                 {x: 9.0, y: 1.85, w: 3.7, h: 2.9, fontFace: FNT.body, fontSize: 14, valign: 'top', margin: [14, 16, 8, 16]});
      ps.addNotes('Disagreement is the point. If everyone agrees quickly, ask who would argue the opposite. Record the disagreements, not only the decisions — they steer the next pass.');

      // --- capture slide
      var cs2 = newSlide('Capture', 'What did the group decide?');
      DECK_CAPTURE[stage].forEach(function(b, i){
        var x = 0.6 + (i % 2) * 6.15, y = 1.85 + Math.floor(i / 2) * 2.5;
        rect(cs2, x, y, 5.95, 2.35, PAL.white, PAL.border, 1);
        cs2.addText([{text: b[0].toUpperCase(), options: {fontFace: FNT.mono, fontSize: 10.5, bold: true, color: PAL.brass, charSpacing: 2, breakLine: true, paraSpaceAfter: 4}},
                     {text: b[1], options: {fontFace: FNT.body, fontSize: 11, italic: true, color: PAL.muted}}],
                    {x: x, y: y, w: 5.95, h: 2.35, valign: 'top', margin: [10, 14, 6, 14]});
      });
      cs2.addNotes('Capture decisions while people are still in the room. Afterwards, upload the transcript or paste these notes into Futures Compass: they become the steering notes for the next pass.');

      return pptx.write({outputType: 'blob'});
    });
  }

  var deckBusy = false;
  function setDeckStatus(msg, isErr){
    var n = document.getElementById('deck-status');
    if (n){ n.textContent = msg; n.className = 'mini' + (isErr ? ' err' : ''); }
  }
  function exportDeck(stage){
    if (deckBusy) return;
    if (!window.PptxGenJS){ setDeckStatus('The deck builder didn’t load — check your connection and reload the page.', true); return; }
    if (!downloadsApi){ setDeckStatus('Saving files isn’t available in this view.', true); return; }
    deckBusy = true;
    var btn = document.getElementById('deck-btn');
    if (btn) btn.disabled = true;
    setDeckStatus('Building the deck… this can take up to 30 seconds.');
    buildDeckImages(stage).then(function(imgs){ return buildDeck(stage, imgs); }).then(function(blob){
      return downloadsApi.save({filename: 'futures-compass-' + stage + '-' + slug(state.domain.problem) + '.pptx', data: blob});
    }).then(function(){
      setDeckStatus('Saved. Take it to the discussion, then come back and add what the group decided.');
    }).catch(function(e){
      var code = e && e.code;
      if (code === 'declined') setDeckStatus('Save cancelled.');
      else if (code === 'rejected_extension' || code === 'extension_not_enabled') setDeckStatus('.pptx files can’t be saved from this view.', true);
      else { setDeckStatus('Couldn’t build or save the deck — try again.', true); try{ console.error(e); }catch(_){} }
    }).then(function(){
      deckBusy = false;
      var b2 = document.getElementById('deck-btn');
      if (b2) b2.disabled = false;
    });
  }

  function buildDiscussBlock(stage){
    var ok = stageHasOutput(stage);
    var box = el('div', {class: 'rail-block discuss'});
    box.appendChild(el('h3', {}, 'Take it to the room'));
    box.appendChild(el('p', {class: 'mini'}, ok
      ? 'One click turns this stage into a short deck: the output, a few questions, and a page to capture what the group decides. Built for a 20–30 minute conversation.'
      : 'Once this stage has output, you can turn it into a discussion deck here.'));
    box.appendChild(el('button', {class: 'btn small', id: 'deck-btn', disabled: !ok, onclick: function(){ exportDeck(stage); }}, 'Export discussion deck (.pptx)'));
    box.appendChild(el('p', {class: 'mini', id: 'deck-status', role: 'status'}, ''));
    return box;
  }

  // ---------- Bring the discussion back ----------
  var transcriptDrafts = {};
  var transcriptOpen = {};
  var MAX_TRANSCRIPT = 42000;

  function cleanTranscript(raw){
    var t = String(raw || '').replace(/\r/g, '');
    t = t.replace(/^WEBVTT.*$/m, '');
    t = t.replace(/^\s*\d+\s*$/gm, '');
    t = t.replace(/^\s*\d{1,2}:\d{2}(:\d{2})?[.,]?\d*\s*-->.*$/gm, '');
    t = t.replace(/^\s*\[?\d{1,2}:\d{2}(:\d{2})?\]?\s*$/gm, '');
    t = t.replace(/<[^>]+>/g, '');
    return t.replace(/[ \t]+/g, ' ').replace(/\n{3,}/g, '\n\n').trim();
  }
  function captureNotes(stage){
    if (stage === 'domain' || !state[stage]) return;
    var ta = document.getElementById(stage + '-notes');
    if (ta) state[stage].notes = ta.value;
  }
  function stageSnapshot(stage){
    if (stage === 'domain') return 'The group was shown the framing: the problem space, time horizon, and perspective above.';
    if (stage === 'drivers'){
      var axes = state.drivers.axisIds.map(function(id){ var d = getDriver(id); return d ? d.name : ''; }).filter(Boolean);
      return 'The group was shown these driving forces (impact/uncertainty out of 5):\n' +
        state.drivers.items.map(function(d, i){ return (i + 1) + '. ' + d.name + ' (' + d.impact + '/' + d.uncertainty + ')'; }).join('\n') +
        (axes.length ? '\nCurrently chosen axes: ' + axes.join(' and ') : '');
    }
    if (stage === 'futures') return 'The group was shown these four futures:\n' + state.futures.quadrants.map(function(q, i){ return (i + 1) + '. ' + q.title + ' — ' + firstSentence(q.narrative); }).join('\n');
    if (stage === 'concepts') return 'The group was shown these concepts (* = shortlisted):\n' + state.concepts.list.map(function(c){ return '- ' + (c.shortlisted ? '* ' : '') + c.name + ' (future: ' + quadTitleById(c.scenarioId) + ')'; }).join('\n');
    return 'The group was shown this strategy board:\n' + state.strategy.classification.map(function(it){ var c = conceptById(it.conceptId); return '- ' + (c ? c.name : it.conceptId) + ': ' + it.bucket; }).join('\n') +
      '\nTripwires: ' + state.strategy.tripwires.map(function(t){ return t.signal; }).join('; ');
  }
  function buildDigestPrompt(stage, transcript, truncated){
    var next = STAGE_NEXT[stage];
    return "You are a facilitator's assistant for a scenario-planning exercise. A team just discussed the output of one stage. Turn the messy transcript of that discussion into clear steering input for an AI planning tool.\n\n" +
      domainBlock() + "\n\nSTAGE DISCUSSED: " + STAGE_LABEL[stage] + "\n" + stageSnapshot(stage) + "\n\n" +
      "TRANSCRIPT" + (truncated ? " (cut off at the length limit — the end of the discussion is missing)" : "") + "\n" +
      "It may contain timestamps, speaker labels, filler words, and transcription errors. If a force, future, or concept is garbled, map it to the closest item shown above.\n---\n" + transcript + "\n---\n\n" +
      "TASK\nReport only what the transcript supports. If the group did not settle something, list it under openQuestions instead of inventing a decision. Keep each list item under 25 words.\n" +
      "- decisions: what the group decided or clearly leaned toward\n- disagreements: where they split, and the competing positions\n- openQuestions: what remained unresolved\n" +
      "- steerThisStage: 1-4 imperative sentences telling the AI how to revise THIS stage's output (empty string if the group wanted it kept as is)\n" +
      "- steerNextStage: 1-4 imperative sentences of guidance for the AI when it produces the " + (next ? STAGE_LABEL[next].toUpperCase() + " stage" : "next step") + " — emphases, constraints, things to avoid, reflecting the group's priorities (empty string if none" + (next ? "" : "; this is the final stage") + ")\n\n" +
      "Reply with only this JSON shape, no other text:\n{\"decisions\":[\"...\"],\"disagreements\":[\"...\"],\"openQuestions\":[\"...\"],\"steerThisStage\":\"...\",\"steerNextStage\":\"...\"}";
  }
  function strList(x){ return Array.isArray(x) ? x.map(function(s){ return String(s).trim(); }).filter(Boolean).slice(0, 8) : []; }
  function mergeNote(existing, previouslyApplied, fresh){
    existing = existing || '';
    if (previouslyApplied && existing.indexOf(previouslyApplied) >= 0) existing = existing.replace(previouslyApplied, '').replace(/\n{3,}/g, '\n\n').trim();
    if (!fresh) return existing;
    return existing ? existing + '\n\n' + fresh : fresh;
  }
  function distillTranscript(stage){
    var ta = document.getElementById('transcript-' + stage);
    var raw = ta ? ta.value : (transcriptDrafts[stage] || '');
    transcriptDrafts[stage] = raw;
    transcriptOpen[stage] = true;
    captureNotes(stage);
    var text = cleanTranscript(raw);
    if (text.length < 80){
      state.lastError = 'That transcript looks too short to summarize — upload or paste the full text.';
      render();
      return;
    }
    var truncated = false;
    if (text.length > MAX_TRANSCRIPT){ text = text.slice(0, MAX_TRANSCRIPT); truncated = true; }
    withBusy('Reading the discussion…', function(signal, onStream){
      return callSample({prompt: buildDigestPrompt(stage, text, truncated), asJson: true, signal: signal, onStream: onStream}).then(function(d){
        d = d || {};
        var prev = state.digests[stage] || {};
        var next = STAGE_NEXT[stage];
        var thisText = d.steerThisStage ? 'From the team discussion: ' + String(d.steerThisStage).trim() : '';
        var nextText = (next && d.steerNextStage) ? 'From the team discussion: ' + String(d.steerNextStage).trim() : '';
        if (stage !== 'domain') state[stage].notes = mergeNote(state[stage].notes, prev.appliedThis, thisText);
        if (next) state[next].notes = mergeNote(state[next].notes, prev.appliedNext, nextText);
        state.digests[stage] = {
          decisions: strList(d.decisions), disagreements: strList(d.disagreements), openQuestions: strList(d.openQuestions),
          steerThisStage: String(d.steerThisStage || '').trim(), steerNextStage: String(d.steerNextStage || '').trim(),
          appliedThis: stage !== 'domain' ? thisText : '', appliedNext: nextText, truncated: truncated
        };
      });
    });
  }

  function setTranscriptMsg(stage, msg, isErr){
    var n = document.getElementById('transcript-msg-' + stage);
    if (n){ n.textContent = msg; n.className = 'mini' + (isErr ? ' err' : ''); }
  }
  var AUDIO_EXT = ['mp3', 'm4a', 'wav', 'aac', 'ogg', 'flac', 'mp4', 'mov', 'webm', 'aiff'];

  function digestList(title, items){
    if (!items || !items.length) return null;
    return el('div', {}, el('h4', {}, title), el('ul', {}, items.map(function(t){ return el('li', {}, t); })));
  }

  function buildTranscriptSection(stage){
    var d = state.digests[stage];
    var det = el('details', {class: 'transcript'});
    if (transcriptOpen[stage] || d) det.setAttribute('open', '');
    det.addEventListener('toggle', function(){ transcriptOpen[stage] = det.open; });
    det.appendChild(el('summary', {}, 'Bring back the group’s discussion'));
    det.appendChild(el('p', {class: 'mini'}, 'Upload or paste a transcript (.txt, .vtt, .srt) from Zoom, Meet, Otter, or any transcription tool. Claude pulls out the decisions and drafts steering notes you can edit.'));

    var ta = el('textarea', {id: 'transcript-' + stage, rows: '5', placeholder: 'Paste the transcript here, or choose a file below…'}, transcriptDrafts[stage] || '');
    var fileInput = el('input', {type: 'file', accept: '.txt,.vtt,.srt,.md,text/plain', 'aria-label': 'Upload a transcript file'});
    fileInput.addEventListener('change', function(e){
      var f = e.target.files && e.target.files[0];
      if (!f) return;
      var ext = (f.name.split('.').pop() || '').toLowerCase();
      if (/^(audio|video)\//.test(f.type) || AUDIO_EXT.indexOf(ext) >= 0){
        setTranscriptMsg(stage, 'Audio can’t be read here. Transcribe the recording first (Zoom, Meet, Otter, or Whisper all work), then upload the text.', true);
        e.target.value = '';
        return;
      }
      var r = new FileReader();
      r.onload = function(){
        ta.value = String(r.result || '');
        transcriptDrafts[stage] = ta.value;
        setTranscriptMsg(stage, f.name + ' loaded — ' + ta.value.length.toLocaleString() + ' characters.');
      };
      r.onerror = function(){ setTranscriptMsg(stage, 'Couldn’t read that file — try pasting the text instead.', true); };
      r.readAsText(f);
    });
    det.appendChild(ta);
    det.appendChild(el('div', {class: 'file-row'}, fileInput));
    det.appendChild(el('p', {class: 'mini', id: 'transcript-msg-' + stage, role: 'status'}, ''));
    det.appendChild(el('div', {class: 'btn-row'},
      el('button', {class: 'btn small', disabled: state.busy || state.aiUnavailable, onclick: function(){ distillTranscript(stage); }}, 'Summarize the discussion'),
      timeHint(state.aiUnavailable ? 'needs Claude access' : 'usually 15-30 seconds')
    ));

    if (d){
      var dg = el('div', {class: 'digest'});
      [digestList('Decided', d.decisions), digestList('Disagreed on', d.disagreements), digestList('Still open', d.openQuestions)].forEach(function(n){ appendMaybe(dg, n); });
      var routed = [];
      var next = STAGE_NEXT[stage];
      if (stage !== 'domain' && d.appliedThis) routed.push('Added to the steering notes above — edit before you regenerate.');
      if (stage === 'domain' && d.steerThisStage) routed.push('Suggested framing changes: ' + d.steerThisStage);
      if (next && d.appliedNext) routed.push('Added to the ' + STAGE_LABEL[next] + ' steering notes, ready when you get there.');
      if (d.truncated) routed.push('The transcript was long, so the last part was left out.');
      routed.forEach(function(t){ dg.appendChild(el('p', {class: 'routed'}, t)); });
      det.appendChild(dg);
    }
    return det;
  }

  function buildDomainRail(){
    var box = el('div', {class: 'rail-block'});
    box.appendChild(el('h3', {}, 'After the discussion'));
    box.appendChild(el('p', {class: 'mini'}, 'Edit the fields on the left to reflect the group’s call. Anything the group wants Claude to weigh when it researches the drivers can be added here.'));
    box.appendChild(buildTranscriptSection('domain'));
    return box;
  }

  // --- Voyage log (always visible) ---
  function buildLog(){
    var box = el('div', {class:'rail-block'});
    box.appendChild(el('h3', {}, 'Voyage log'));
    var items = [];
    if (state.domain.problem) items.push(el('div', {class:'log-item'}, el('b',{},'Domain'), state.domain.problem));
    if (state.drivers.axisIds.length === 2){
      var a = getDriver(state.drivers.axisIds[0]), b = getDriver(state.drivers.axisIds[1]);
      items.push(el('div', {class:'log-item'}, el('b',{},'Axes'), (a?a.name:'') + ' × ' + (b?b.name:'')));
    }
    if (state.futures.quadrants.length) items.push(el('div', {class:'log-item'}, el('b',{},'Futures'), state.futures.quadrants.map(function(q){return q.title;}).join(' · ')));
    var shortlisted = state.concepts.list.filter(function(c){return c.shortlisted;});
    if (shortlisted.length) items.push(el('div', {class:'log-item'}, el('b',{},'Shortlisted concepts'), shortlisted.map(function(c){return c.name;}).join(', ')));
    if (state.strategy.classification.length) items.push(el('div', {class:'log-item'}, el('b',{},'Strategy'), state.strategy.classification.length + ' concepts classified, ' + state.strategy.tripwires.length + ' tripwires'));
    if (!items.length) items.push(el('div', {class:'log-empty'}, 'Nothing charted yet.'));
    items.forEach(function(i){ box.appendChild(i); });
    return box;
  }

  function renderCanvas(){
    var canvasEl = document.getElementById('canvas');
    canvasEl.innerHTML = '';
    var builders = {domain:buildDomainCanvas, drivers:buildDriversCanvas, futures:buildFuturesCanvas, concepts:buildConceptsCanvas, strategy:buildStrategyCanvas};
    canvasEl.appendChild(builders[state.stage]());
  }

  function renderRail(){
    var railEl = document.getElementById('rail');
    railEl.innerHTML = '';
    var builders = {drivers:buildDriversRail, futures:buildFuturesRail, concepts:buildConceptsRail, strategy:buildStrategyRail};
    railEl.appendChild(buildDiscussBlock(state.stage));
    if (builders[state.stage]){
      var box = builders[state.stage]();
      var notesTa = box.querySelector('textarea');
      if (notesTa) box.insertBefore(el('p', {class: 'mini'}, 'Your guidance, or what the group decided. Claude reads it the next time this stage runs; summarizing a discussion (below) fills it in for you.'), notesTa);
      box.appendChild(buildTranscriptSection(state.stage));
      railEl.appendChild(box);
    } else if (state.stage === 'domain'){
      railEl.appendChild(buildDomainRail());
    }
    railEl.appendChild(buildLog());
  }

  function render(){
    renderCourse();
    renderCanvas();
    renderRail();
    renderWire();
    renderBanner();
    saveLocal();
  }

  document.getElementById('reset-btn').addEventListener('click', resetApp);

  render();
  Promise.all([useCap('sample'), useCap('downloads')]).then(function(res){
    sampleApi = res[0]; downloadsApi = res[1];
    if (!sampleApi){
      state.aiUnavailable = true;
      state.aiUnavailableReason = "This page isn't running with Claude access — each stage below runs manually.";
    }
    render();
  });
})();
</script>
